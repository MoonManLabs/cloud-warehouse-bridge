[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-warehouse-bridge"
version = "0.1.0"
description = "Independent open-source tooling for evaluating and integrating Vertica workloads with cloud data warehouses and object storage."
requires-python = ">=3.10"
dependencies = []
keywords = [
  "analytics",
  "cloud-data-warehouse",
  "data-engineering",
  "databricks",
  "minio",
  "object-storage",
  "postgresql",
  "snowflake",
  "sql-server",
  "vertica",
]

[project.urls]
Homepage = "https://github.com/MoonManLabs/cloud-warehouse-bridge"
Repository = "https://github.com/MoonManLabs/cloud-warehouse-bridge"

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
vpowerpacks = "vpowerpacks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
