[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertica-cloud-warehouse-bridge"
version = "0.1.0"
description = "Open-source planning tools for evaluating governed analytical workloads across Databricks, Snowflake, object storage, and Vertica."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
vpowerpacks = "vpowerpacks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
